name: Release

# Publishing runs on version tags only. A manual `workflow_dispatch` builds the
# distribution (for a dry run) but skips the PyPI upload and GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ipax
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing (no API token).
      actions: read # explicit scope for actions/download-artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        # Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # explicit scope for actions/download-artifact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Determine version
        id: version
        # Strip the leading 'v' from the tag name (e.g. v0.1.1 -> 0.1.1).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.version.outputs.version }}
          path: CHANGELOG.md
      - name: Read tag annotation
        id: tag_annotation
        run: |
          ANNOTATION=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo 'annotation<<EOF'
            echo "$ANNOTATION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Write release notes file
        run: |
          {
            if [[ -n "${{ steps.tag_annotation.outputs.annotation }}" ]]; then
              echo "${{ steps.tag_annotation.outputs.annotation }}"
              echo ""
              echo "---"
              echo ""
            fi
            echo "${{ steps.changelog.outputs.changes }}"
          } > RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ steps.changelog.outputs.status == 'prereleased' || steps.changelog.outputs.status == 'unreleased' }}
