name: Release

# Publishing runs on version tags only. A manual `workflow_dispatch` builds the
# distribution (for a dry run) but skips the PyPI upload and GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ipax
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing (no API token).
      actions: read # explicit scope for actions/download-artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        # Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # explicit scope for actions/download-artifact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Determine version
        id: version
        # Strip the leading 'v' from the tag name (e.g. v0.1.1 -> 0.1.1).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.version.outputs.version }}
          path: CHANGELOG.md
      - name: Read tag annotation
        id: tag_annotation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only an *annotated* tag carries a message. actions/checkout can
          # fetch a tag as lightweight (pointing straight at the commit), and
          # then `%(contents)` falls through to the commit message — which for a
          # merge commit is multi-line text we must not put in the release notes
          # (v0.6.1: injecting it broke the next step). Emit the annotation only
          # for a real tag object; otherwise leave it empty and let the
          # changelog stand alone.
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            ANNOTATION=$(git tag -l --format='%(contents)' "$TAG")
          else
            ANNOTATION=""
          fi
          {
            echo 'annotation<<RELNOTES_EOF'
            echo "$ANNOTATION"
            echo 'RELNOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Write release notes file
        # Pass the annotation and changelog through the environment, never via
        # `${{ }}` interpolation into the script body: multi-line values with
        # quotes or shell metacharacters would otherwise be spliced into the
        # bash source and break parsing (v0.6.1 exited 127 this way). Quoted
        # `printf "%s"` on an env var is inert — no re-parsing, no word-split.
        env:
          ANNOTATION: ${{ steps.tag_annotation.outputs.annotation }}
          CHANGES: ${{ steps.changelog.outputs.changes }}
        run: |
          {
            if [ -n "$ANNOTATION" ]; then
              printf '%s\n\n---\n\n' "$ANNOTATION"
            fi
            printf '%s\n' "$CHANGES"
          } > RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ steps.changelog.outputs.status == 'prereleased' || steps.changelog.outputs.status == 'unreleased' }}
