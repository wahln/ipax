[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "ipax"
# Single source of truth: ``ipax.__version__`` (see [tool.hatch.version]).
dynamic = ["version"]
description = "Array-API-conformant primal–dual interior-point solver for large-scale nonlinear constrained optimization."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Niklas Wahl", email = "niklaswahl2011@gmail.com" }]
keywords = [
    "optimization",
    "interior-point",
    "nonlinear-programming",
    "array-api",
    "radiotherapy",
    "primal-dual",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# Core runtime deps are deliberately tiny: the solver core never imports a
# concrete array library (invariant #1). We only depend on the Array API
# compatibility shims used to resolve namespaces and fill standard gaps.
dependencies = [
    "array-api-compat>=1.9",
    "array-api-extra>=0.6",
]

[project.urls]
Homepage = "https://github.com/wahln/ipax"
Documentation = "https://ipax.readthedocs.io/"
Source = "https://github.com/wahln/ipax"
Issues = "https://github.com/wahln/ipax/issues"

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
# Backends are optional extras: the core works against whatever Array-API
# namespace the user's problem returns. CI installs `numpy,torch,strict`.
[project.optional-dependencies]
numpy = ["numpy>=1.26"]
torch = ["torch>=2.2"]
jax = ["jax>=0.4.28", "jaxlib>=0.4.28"]
# CUDA is user-managed: install the CuPy wheel matching the local toolkit
# (for example cupy-cuda12x or cupy-cuda13x) before installing ipax.
# Sparse-direct adapters (non-Array-API; need extra native setup). These are the
# specialized backends from invariant #4, kept apart from the pure Array-API
# backend extras above.
#   sparse-cpu : SciPy COO/CSC assembly + Feral LDLᵀ (reference CPU path).
#   sparse-cuda: nvmath cuDSS bindings only. CUDA, the matching CuPy wheel, and
#                the cuDSS runtime are user-managed. Without cuDSS the CuPy
#                adapter degrades to cupyx ... spsolve.
#   sparse     : both adapters.
sparse-cpu = ["scipy>=1.12", "feral-solver[scipy]>=0.11,<0.12"]
sparse-cuda = ["nvmath-python; platform_system != 'Darwin'"]
sparse = ["ipax[sparse-cpu,sparse-cuda]"]
strict = ["array-api-strict>=2.1"]

test = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "sympy>=1.13",           # symbolic KKT/regularization verification gate (§8.2)
]
bench = [
    "asv>=0.6",
    "pytest-benchmark>=4",
    "memray>=1.13; sys_platform != 'win32'",
    "matplotlib>=3.8",       # report plots (§9.4); optional, imported lazily
    "osqp>=1.0",             # QP reference baseline (§9.3); optional
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
lint = [
    "codespell>=2.3",
    "mypy>=1.11",
    "pre-commit>=3.7",
    # Keep the floor at the version whose formatting the tree conforms to, and
    # in step with .pre-commit-config.yaml: 0.16 began formatting Python code
    # blocks inside Markdown, so an older resolve silently under-checks the docs.
    "ruff>=0.16.2",
]
# Convenience meta-extra for a full local dev environment (NumPy + Torch CI set).
dev = [
    "ipax[numpy,torch,strict,sparse-cpu,test,bench,docs,lint]",
]

# ---------------------------------------------------------------------------
# Hatch build configuration (src-layout)
# ---------------------------------------------------------------------------
# Derive the project version from ``__version__`` in the package itself, so the
# version is declared in exactly one place.
[tool.hatch.version]
path = "ipax/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ipax"]

[tool.hatch.build.targets.sdist]
include = [
    "ipax",
    "tests",
    "conftest.py",      # root pytest config: required for the suite to collect
    "examples",
    "benchmarks",
    "docs",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "NOTICE",
]

# ---------------------------------------------------------------------------
# Ruff (format + lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = [".", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes / pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "NPY",              # numpy-specific (guards the purity boundary too)
    "RUF",
]
ignore = [
    "E501",             # line length handled by formatter
    "RUF001",           # math docs intentionally use Greek / symbolic Unicode
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["ipax"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# codespell
# ---------------------------------------------------------------------------
[tool.codespell]
ignore-words-list = "coo,fiel,crasher"
skip = ".git,.mypy_cache,.pytest_cache,.ruff_cache,.venv,__pycache__,build,dist,*.egg-info"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["ipax"]
strict = true
warn_unreachable = true
disallow_any_generics = true
# Backends are optional; their stubs may be missing in a minimal env (e.g. the
# CI `lint` job installs only `[lint]`, so the numpy/scipy sparse adapter is
# type-checked without numpy present).
[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "jax.*", "cupy.*", "scipy.*", "array_api_strict.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "array_api_compat",
    "array_api_compat.*",
    "cupyx.*",
    "feral",
    "feral.*",
    "mumps",
    "mumps.*",
    "nvmath.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# ``ipax`` is included so ``--doctest-modules`` verifies docstring examples
# (e.g. FunctionProblem); it contributes no regular tests.
testpaths = ["tests", "ipax"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires a CUDA/ROCm device",
    "sparse: exercises a sparse-direct backend adapter",
]
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Coverage (≥90% gate on the core, §8.2)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["ipax"]
omit = [
    "ipax/problem/autodiff/*",
    "ipax/backend/sparse/*",
    # GPU-only dense adapter (cuSOLVER via nvmath): unmeasurable until GPU CI
    # exists, same policy as the sparse adapters above. The SciPy/Torch dense
    # adapters stay measured — CI exercises them.
    "ipax/backend/dense/cupy.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
